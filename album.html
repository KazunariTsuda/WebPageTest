<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Album | Wedding</title>
  <meta name="robots" content="noindex,nofollow">
  <style>
    :root{--bg:#fffaf3;--ink:#3f342c;--sub:#7f6b5d;--accent:#c97947;--line:#ead8c8}
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:var(--ink)}
    .wrap{max-width:820px;margin:auto;padding:26px 18px 48px}
    .back{text-decoration:none;color:var(--accent);font-size:14px}
    h1{font-family:Georgia,serif;font-weight:500;font-size:34px;margin:26px 0 8px}
    .intro{color:var(--sub);margin-bottom:22px}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    .photo{aspect-ratio:1/1;border-radius:14px;background:linear-gradient(145deg,#ead6c4,#f8eee5);display:grid;place-items:center;text-align:center;color:var(--sub);font-size:13px;padding:12px;overflow:hidden}
    .photo img{width:100%;height:100%;object-fit:cover}
    @media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
  <main class="wrap">
    <a class="back" id="backLink" href="index.html">← Topへ戻る</a>
    <h1>Album</h1>
    <div class="intro">ふたりの思い出を少しだけ。</div>

    <section class="grid">
      <div class="photo">写真 1<br>images/photo01.jpg</div>
      <div class="photo">写真 2<br>images/photo02.jpg</div>
      <div class="photo">写真 3<br>images/photo03.jpg</div>
      <div class="photo">写真 4<br>images/photo04.jpg</div>
      <div class="photo">写真 5<br>images/photo05.jpg</div>
      <div class="photo">写真 6<br>images/photo06.jpg</div>
    </section>
  </main>
<script>
const guest = new URLSearchParams(location.search).get("guest");
if (guest) document.getElementById("backLink").href = "index.html?guest=" + encodeURIComponent(guest);
</script>
</body>
</html>
